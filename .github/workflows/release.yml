name: Release macOS (draft only)

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/build.yml

  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate repository and release versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$GITHUB_REPOSITORY" = 'imadAttar/orbit'
          python3 scripts/release.py check-version --tag "$RELEASE_TAG"
      - name: Require existing updater key without exposing or rotating it
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$UPDATER_KEY" ]; then
            echo '::error::Existing TAURI_SIGNING_PRIVATE_KEY is required.'
            exit 1
          fi
      - name: Refuse to modify a published release
        uses: actions/github-script@v8
        with:
          script: |
            try {
              const {data} = await github.rest.repos.getReleaseByTag({...context.repo, tag: context.ref.replace('refs/tags/', '')});
              if (!data.draft) core.setFailed('Release already published; refusing to modify it.');
            } catch (error) {
              if (error.status !== 404) throw error;
            }

  build:
    needs: [check, preflight]
    runs-on: macos-15
    name: Build macOS Apple Silicon
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: brew install create-dmg
      - run: npm ci
      - name: Build DMG and signed updater with existing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --target aarch64-apple-darwin --bundles app,dmg -- --locked
      - name: Verify macOS application code signature
        run: codesign --verify --deep --strict src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Orbit.app
      - name: Collect only exact macOS payload, installer and signature
        run: python3 scripts/release.py collect --input src-tauri/target/aarch64-apple-darwin/release/bundle --output artifacts --platform macos-arm64
      - name: Record signing and platform scope honestly
        run: |
          printf '%s\n' 'macOS Apple Silicon only: ad-hoc signed; NOT Developer ID signed or notarized.' 'Updater: signed with existing production key; independent minisign verification required.' 'No Windows, Linux or Intel macOS payload is advertised by this release.' > artifacts/SIGNING-STATUS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos-arm64
          path: artifacts/*
          if-no-files-found: error

  draft:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y minisign
      - uses: actions/download-artifact@v8
        with:
          name: release-macos-arm64
          path: artifacts
      - name: Verify exact macOS manifest, signatures and SHA256 coverage
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/release.py prepare --input artifacts --output release-assets --tag "$RELEASE_TAG" --repo imadAttar/orbit --platforms macos-arm64
          python3 scripts/release.py verify --output release-assets --tag "$RELEASE_TAG" --repo imadAttar/orbit --platforms macos-arm64
      - uses: actions/upload-artifact@v7
        with:
          name: verified-release-assets
          path: release-assets/*
          if-no-files-found: error
      - name: Recheck that release is still a draft before upload
        uses: actions/github-script@v8
        with:
          script: |
            try {
              const {data} = await github.rest.repos.getReleaseByTag({...context.repo, tag: context.ref.replace('refs/tags/', '')});
              if (!data.draft) core.setFailed('Release already public; refusing any modification.');
            } catch (error) {
              if (error.status !== 404) throw error;
            }
      - name: Create independently verifiable draft only
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            macOS Apple Silicon release. Includes the DMG installer, updater payload/signature, latest.json and SHA256SUMS.
            Ad-hoc signed, not Developer ID signed or notarized. Gatekeeper warnings may appear.
            Draft awaits independent download/signature verification before authorized publication.
          files: release-assets/*
